# AUTHORITATIVE — deployed to /srv/homelab by the compose-stack module on
# every switch; hand-edits on the VM are overwritten. Images are pinned as
# repo:tag@sha256:… — the digest decides what runs (exact bytes), the tag
# lets Renovate read the version. Upgrades arrive as one weekly Renovate PR
# (renovate.json; docs/NIXOS-INFRA.md). By hand: change tag AND digest.
services:
  ts-budget:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-budget
    hostname: budget
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-budget/state:/var/lib/tailscale
      - ./ts-budget/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  actual-budget:
    image: actualbudget/actual-server:26.9.0@sha256:552beab3dec8c93d46b8b9245612d63c3f123b8a45063a474f53e229b17621d3
    container_name: actual-budget
    restart: unless-stopped
    network_mode: service:ts-budget
    depends_on:
      - ts-budget
    volumes:
      - ./actual-budget:/data

  ts-homepage:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-homepage
    hostname: homepage
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-homepage/state:/var/lib/tailscale
      - ./ts-homepage/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.4.0@sha256:643bd0be730d40f69d58028a55d1a896739333e8815786df42bc97f109ecbe61
    container_name: homepage
    restart: unless-stopped
    network_mode: service:ts-homepage
    depends_on:
      - ts-homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.jaguar-duckbill.ts.net
      # MCP endpoint at /api/mcp, tailnet-only via the ts-homepage sidecar.
      # Token lives in sops (homepage-mcp-token); writes are on so an
      # assistant can add services/widgets (YAML is validated before save).
      HOMEPAGE_MCP_ENABLED: "true"
      HOMEPAGE_MCP_ALLOW_WRITE: "true"
      HOMEPAGE_MCP_TOKEN: ${HOMEPAGE_MCP_TOKEN}
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  ts-ntfy:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-ntfy
    hostname: ntfy
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-ntfy/state:/var/lib/tailscale
      - ./ts-ntfy/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  ntfy:
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    container_name: ntfy
    restart: unless-stopped
    network_mode: service:ts-ntfy
    depends_on:
      - ts-ntfy
    command: serve
    environment:
      # iOS can't get instant push from a self-hosted server on its own:
      # only ntfy.sh is registered with Apple's APNs. With upstream-base-url
      # set, this server relays a wake-up ping (topic reference only, no
      # message content) through ntfy.sh; the app then fetches the actual
      # message from here over the tailnet. Without it, alerts sit until
      # the app is opened. base-url must be set for the relay to work.
      NTFY_BASE_URL: https://ntfy.jaguar-duckbill.ts.net
      NTFY_UPSTREAM_BASE_URL: https://ntfy.sh
      # Persist the message cache (SQLite, under /srv/homelab so the nightly
      # backup mirrors it). Without a cache file ntfy keeps messages in memory
      # only: a container recreate or VM reboot drops them, including ones the
      # iPhone app hasn't fetched yet after its ntfy.sh wake-up ping. 72h
      # (default 12h) lets a phone that was offline over a weekend catch up.
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
    volumes:
      - ./ntfy/cache:/var/cache/ntfy
      - ./ntfy/config:/etc/ntfy

  ts-adguard:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-adguard
    hostname: adguard
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-adguard/state:/var/lib/tailscale
      - ./ts-adguard/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  adguardhome:
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: adguardhome
    restart: unless-stopped
    network_mode: service:ts-adguard
    depends_on:
      - ts-adguard
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf

  ts-librespeed:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-librespeed
    hostname: librespeed
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-librespeed/state:/var/lib/tailscale
      - ./ts-librespeed/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  librespeed:
    image: linuxserver/librespeed:v6.3.0-ls291@sha256:5e7ba354832be35ed2638f58ff035e101c6494d7282a2cf88aa180545d7fd58c
    container_name: librespeed
    restart: unless-stopped
    network_mode: service:ts-librespeed
    depends_on:
      - ts-librespeed
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
    volumes:
      - ./librespeed/config:/config

  ts-metube:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-metube
    hostname: metube
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-metube/state:/var/lib/tailscale
      - ./ts-metube/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  metube:
    image: ghcr.io/alexta69/metube:2026.09.25@sha256:549f4b0eeb13b01ecae2a20b50153d17481b1d59b517de5ae0dddee03e058745
    container_name: metube
    restart: unless-stopped
    network_mode: service:ts-metube
    depends_on:
      - ts-metube
    environment:
      UID: 1000
      GID: 1000
      TZ: America/Chicago
      STATE_DIR: /state
      YTDL_OPTIONS: '{"format":"bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best","merge_output_format":"mp4"}'
    volumes:
      - /mnt/data/Videos/MeTube:/downloads
      - ./metube/state:/state

  # changedetection.io — web-page change monitor (hosts/nixos/nixos-infra/
  # changedetection.nix has the why, the serve.json and the disable steps).
  # Same shape as actual-budget: the app shares this sidecar's network
  # namespace; serve.json is nix-generated and bind-mounted from /etc like
  # ts-status, so nothing about this service is hand-made on the VM.
  ts-changes:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-changes
    hostname: changes
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-changes/state:/var/lib/tailscale
      - /etc/ts-changes/serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:0.60.7@sha256:096dae27b5d677b89f0e810fff95a70403271aa3ff3b6437952d2db9be7e74c5
    container_name: changedetection
    restart: unless-stopped
    network_mode: service:ts-changes
    depends_on:
      - ts-changes
      - sockpuppetbrowser
    environment:
      BASE_URL: https://changes.jaguar-duckbill.ts.net # links in notifications
      USE_X_SETTINGS: "1" # trust X-Forwarded-* from tailscale serve
      HIDE_REFERER: "true"
      PLAYWRIGHT_DRIVER_URL: ws://sockpuppetbrowser:3000
      TZ: America/Chicago # per-watch time windows use this
    volumes:
      - ./changedetection:/datastore

  # Headless Chrome for changedetection's Playwright fetcher (Browser
  # Steps, Visual Selector, JS-rendered sites). Deliberately NOT in the
  # ts-changes namespace and with no published ports: it is reachable only
  # by service name over the compose network, so Chrome's CDP endpoint is
  # never exposed on the tailnet. SYS_ADMIN is what upstream ships for
  # Chrome's sandbox. Concurrency is capped below upstream's 10 because
  # this is a small VM.
  sockpuppetbrowser:
    image: dgtlmoon/sockpuppetbrowser:latest@sha256:1d8f72d2ce2085faed4232e5ae1e65c02efe5b831a18e127829b267c260b4fb2 # upstream publishes no version tags; Renovate bumps the digest
    container_name: sockpuppetbrowser
    restart: unless-stopped
    environment:
      SCREEN_WIDTH: "1920"
      SCREEN_HEIGHT: "1024"
      SCREEN_DEPTH: "16"
      MAX_CONCURRENT_CHROME_PROCESSES: "4"
    # Its stats thread logs "Active count 0 of max 4" every 3 seconds — ~58k
    # messages/day, a third of the entire journal, none of it actionable. The
    # host-wide docker log driver is journald, so override it here only: the
    # local driver keeps `docker logs sockpuppetbrowser` working for debugging
    # Chrome fetch failures, bounds it at 30 MB, and keeps it out of journald.
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    cap_add:
      - SYS_ADMIN

  # Stirling PDF — PDF toolbox (hosts/nixos/nixos-infra/stirling-pdf.nix
  # has the why, the serve.json and the disable steps). Same shape as
  # changedetection: the app shares this sidecar's network namespace and
  # serve.json is nix-generated and bind-mounted from /etc.
  ts-pdf:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-pdf
    hostname: pdf
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-pdf/state:/var/lib/tailscale
      - /etc/ts-pdf/serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  stirling-pdf:
    image: stirlingtools/stirling-pdf:2.14.3@sha256:3b3670fce70b396ec56ba380a3cc7858e0abf83fe13f31c88f7737847763a396 # standard variant: OCR + office conversion; not -fat, not -ultra-lite
    container_name: stirling-pdf
    restart: unless-stopped
    network_mode: service:ts-pdf
    depends_on:
      - ts-pdf
    environment:
      # The tailnet is the auth boundary. 2.x ships with login ON and a
      # default admin/stirling password; leaving that on would put a
      # known-default login on the tailnet for no gain.
      SECURITY_ENABLELOGIN: "false"
      # Skips loading the login/SSO/enterprise jar entirely — less code
      # on the listening path, and it is what upstream's own compose does.
      DISABLE_ADDITIONAL_FEATURES: "true"
      SYSTEM_DEFAULTLOCALE: en-US
      SYSTEM_ENABLEANALYTICS: "false" # no phone-home from the homelab
      SHOW_SURVEY: "false"
      TZ: America/Chicago
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v1/info/status | grep -q UP"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s # JVM + LibreOffice warm-up on a 2-vCPU VM
    volumes:
      - ./stirling-pdf/tessdata:/usr/share/tessdata # OCR language packs
      - ./stirling-pdf/configs:/configs
      - ./stirling-pdf/logs:/logs
      - ./stirling-pdf/pipeline:/pipeline

  # draw.io — diagram editor (hosts/nixos/nixos-infra/drawio.nix has the
  # why, the serve.json and the disable steps). Same shape as stirling-pdf:
  # the app shares this sidecar's network namespace and serve.json is
  # nix-generated and bind-mounted from /etc. Stateless: no app volume.
  ts-drawio:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-drawio
    hostname: drawio
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-drawio/state:/var/lib/tailscale
      - /etc/ts-drawio/serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  drawio:
    image: jgraph/drawio:31.4.6@sha256:139b43305b77c46575d5af5dcc7b6c38dc7ea22f430fdfe954fb8f96926643e5
    container_name: drawio
    restart: unless-stopped
    network_mode: service:ts-drawio
    depends_on:
      - ts-drawio
    environment:
      # Absolute URL the app uses for its own links (embed/share/plugins);
      # without it the default is http://localhost:8080.
      DRAWIO_BASE_URL: https://drawio.jaguar-duckbill.ts.net
      TZ: America/Chicago
    healthcheck:
      # curl is in the image (the entrypoint uses it). Tomcat serves the
      # editor at / once the webapp has deployed.
      test: ["CMD-SHELL", "curl -fs -o /dev/null http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s # JVM warm-up on a 2-vCPU VM

  # Tailscale front for Gatus, which runs natively on the host (see
  # hosts/nixos/nixos-infra/gatus.nix) rather than as a container sharing
  # this network namespace. Two consequences vs the other sidecars:
  # serve.json is nix-generated and bind-mounted from /etc, and the proxy
  # target is host.docker.internal (the VM) instead of 127.0.0.1.
  ts-status:
    image: tailscale/tailscale:v1.102.5@sha256:c507f3a2a6ab1cabd8d809b98edeb41edbd5c3fb6ad9632ffd098b4c7d0b4065
    container_name: ts-status
    hostname: status
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./ts-status/state:/var/lib/tailscale
      - /etc/ts-status/serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
