# Fast, free evaluation of every host on each push.
# Runs on Linux: it does NOT build (that needs macOS), it only evaluates the
# full module tree for each host, which catches ~95% of breakage — syntax
# errors, missing options, module conflicts, and per-host metadata branches.
name: Eval 🔍

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    name: Eval ${{ matrix.host }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: mbp
            attr: darwinConfigurations.mbp.system
          - host: mini
            attr: darwinConfigurations.mini.system
          - host: air
            attr: darwinConfigurations.air.system
          - host: studio
            attr: darwinConfigurations.studio.system
          - host: nixos-infra
            attr: nixosConfigurations.nixos-infra.config.system.build.toplevel
          - host: t3-code
            attr: nixosConfigurations.t3-code.config.system.build.toplevel
    steps:
      - uses: actions/checkout@v4
      # flake.nix has a private input; nix cannot evaluate a darwin host
      # without being able to read it.
      - uses: ./.github/actions/private-flake-key
        with:
          key: ${{ secrets.BILLFILER_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Evaluate ${{ matrix.host }}
        # Forcing .drvPath instantiates the whole config without building it.
        run: nix eval --raw ".#${{ matrix.attr }}.drvPath"
