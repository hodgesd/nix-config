# AUTHORITATIVE — deployed to /srv/homelab by the compose-stack module on
# every switch; hand-edits on the VM are overwritten. Images are pinned by
# digest (exact bytes; the comment is the human-readable version). To
# upgrade a service: put its :latest (or a specific tag) here, deploy, then
# re-pin to the new digest from `docker image inspect`.
# Uptime Kuma used to live here (ts-uptime + uptime-kuma). It moved to the
# mini on 2026-08-08 so the monitor no longer shares a fate with the host it
# watches — see stacks/uptime/docker-compose.yml. Its data and the sidecar's
# tailnet identity were migrated, so the URL and every push-monitor token
# are unchanged. /srv/homelab/uptime-kuma and /srv/homelab/ts-uptime are now
# stale on this host and can be deleted once the move has soaked.
services:
  ts-budget:
    image: tailscale/tailscale@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0 # v1.98.4
    container_name: ts-budget
    hostname: budget
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-budget/state:/var/lib/tailscale
      - ./ts-budget/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  actual-budget:
    image: actualbudget/actual-server@sha256:1aeeb3985db55556e716dec25e08f6ce09308c2571b65cddbc6746ee6d5e0d45 # 26.5.2
    container_name: actual-budget
    restart: unless-stopped
    network_mode: service:ts-budget
    depends_on:
      - ts-budget
    volumes:
      - ./actual-budget:/data

  ts-homepage:
    image: tailscale/tailscale@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0 # v1.98.4
    container_name: ts-homepage
    hostname: homepage
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-homepage/state:/var/lib/tailscale
      - ./ts-homepage/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  homepage:
    image: ghcr.io/gethomepage/homepage@sha256:d8d784e5090111b6e4c56dfd90e272d2953a2094e87349f647165df0fa6c4401 # v1.13.1
    container_name: homepage
    restart: unless-stopped
    network_mode: service:ts-homepage
    depends_on:
      - ts-homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.jaguar-duckbill.ts.net
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  ts-ntfy:
    image: tailscale/tailscale@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0 # v1.98.4
    container_name: ts-ntfy
    hostname: ntfy
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-ntfy/state:/var/lib/tailscale
      - ./ts-ntfy/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  ntfy:
    image: binwiederhier/ntfy@sha256:b32b4221a64ec2e7c000f0782b2feef24022e1a09a24e531640f4cbba6cfa1e6 # as of 2026-07-26
    container_name: ntfy
    restart: unless-stopped
    network_mode: service:ts-ntfy
    depends_on:
      - ts-ntfy
    command: serve
    volumes:
      - ./ntfy/cache:/var/cache/ntfy
      - ./ntfy/config:/etc/ntfy

  ts-adguard:
    image: tailscale/tailscale@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0 # v1.98.4
    container_name: ts-adguard
    hostname: adguard
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-adguard/state:/var/lib/tailscale
      - ./ts-adguard/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  adguardhome:
    image: adguard/adguardhome@sha256:7157eb1dc3b26c7af1d6898759a7b3f7d0fa09891fbd2d3caa6abc1057a9179b # v0.107.76
    container_name: adguardhome
    restart: unless-stopped
    network_mode: service:ts-adguard
    depends_on:
      - ts-adguard
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf

  ts-librespeed:
    image: tailscale/tailscale@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0 # v1.98.4
    container_name: ts-librespeed
    hostname: librespeed
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-librespeed/state:/var/lib/tailscale
      - ./ts-librespeed/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  librespeed:
    image: linuxserver/librespeed@sha256:4f76560a263044e6bc5ca25287ab6f72259a1f22a53cbea585d87dfe34ff6e6a # 6.1.0-ls275
    container_name: librespeed
    restart: unless-stopped
    network_mode: service:ts-librespeed
    depends_on:
      - ts-librespeed
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/Chicago
    volumes:
      - ./librespeed/config:/config

  ts-metube:
    image: tailscale/tailscale@sha256:25cde9ad76020b0e29229136d0c38b5962e9a0e1774ffac9b0df68e4a37d6cf0 # v1.98.4
    container_name: ts-metube
    hostname: metube
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ./ts-metube/state:/var/lib/tailscale
      - ./ts-metube/config:/config
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE

  metube:
    image: ghcr.io/alexta69/metube@sha256:3b3b847a125e78037983d3a27c76212e2fc7a0c3a813591ec0de53613e0be874 # as of 2026-07-26
    container_name: metube
    restart: unless-stopped
    network_mode: service:ts-metube
    depends_on:
      - ts-metube
    environment:
      UID: 1000
      GID: 1000
      TZ: America/Chicago
      STATE_DIR: /state
      YTDL_OPTIONS: '{"format":"bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best","merge_output_format":"mp4"}'
    volumes:
      - /mnt/data/Videos/MeTube:/downloads
      - ./metube/state:/state
