# Full macOS build of every host. Thorough but expensive, so it only runs when
# flake.lock changes (the risky dependency bump), nightly, or on demand.
# Built store paths are pushed to Cachix so local `darwin-rebuild switch`
# downloads them instead of recompiling.
#
# Requires repository secret CACHIX_AUTH_TOKEN (see .github/workflows/README.md).
name: Build 🍎

on:
  # Build every PR too — free on public repos, and the only way to catch
  # build-time breakage (vs eval) before merge. Cachix keeps it fast.
  pull_request:
  push:
    branches:
      - main
    paths:
      - flake.lock
  schedule:
    # nightly at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.host }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        host: [mbp, mini, air, studio]
    steps:
      - uses: actions/checkout@v4
      # flake.nix has a private input; nix cannot evaluate a darwin host
      # without being able to read it.
      - uses: ./.github/actions/private-flake-key
        with:
          key: ${{ secrets.BILLFILER_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          # agent-workbench-client.nix installs herdr (a Rust+Zig source
          # build) on mbp/air; numtide's cache turns it into a download.
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - uses: cachix/cachix-action@v15
        with:
          name: hodgesd-nix-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build ${{ matrix.host }}
        run: nix build -L ".#darwinConfigurations.${{ matrix.host }}.system"

  # ubuntu-latest is x86_64, matching the VMs. Pushing the closure to Cachix
  # means the VMs' flake switches are mostly downloads.
  build-linux:
    name: Build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [nixos-infra, t3-code]
    steps:
      - uses: actions/checkout@v4
      # flake.nix has a private input; nix cannot evaluate a darwin host
      # without being able to read it.
      - uses: ./.github/actions/private-flake-key
        with:
          key: ${{ secrets.BILLFILER_DEPLOY_KEY }}
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          # The llm-agents input (agent-workbench.nix) ships herdr as a
          # Rust+Zig source build; numtide's cache turns that into a
          # download instead of a compile on every PR.
          extra-conf: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=
      - uses: cachix/cachix-action@v15
        with:
          name: hodgesd-nix-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build ${{ matrix.host }}
        run: nix build -L ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
